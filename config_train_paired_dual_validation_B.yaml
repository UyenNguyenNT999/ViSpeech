name: paired_dual_validation_B
initial_checkpoint: checkpoints/dialect/resnet34_sampler111_20261019_100521_712784/best_1.pth
output_root: checkpoints/dialect
audio:
  length: 5
  sampling_rate: 22050
  n_mels: 64
  window_configs:
    22050: [1024, 552, 220]
model:
  type: resnet34
  version: v0.9.0
  dropout: 0.3
training:
  seed: 42
  batch_size: 16 # 16 pairs / 32 waveforms, identical to A
  learning_rate: 0.00001
  weight_decay: 0.0005
  max_steps: 3060 # Fixed budget; NO early stopping
  validation_every_steps: 306
  consistency_weight: 0.1 # Same loss weight as original paired B
noise:
  path: augmentation/background_noise
  snr_db_min: 0.0
  snr_db_max: 20.0
datasets:
  trainset: dataset/train.txt
  valset: dataset/validation.txt
validation:
  fixed_directory: dataset/fixed_noise_validation_dual
  clean_batch_size: 16
  noisy_batch_size: 4
  # Percentage points, NOT a fraction. 91.84% - 0.5 pp = 91.34%.
  max_clean_accuracy_drop_pp: 0.5
