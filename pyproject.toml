[project]
name = "vispeech-experiments"
version = "0.1.0"
description = "Local reproduction of ViSpeech gender and dialect experiments"
requires-python = ">=3.9,<3.10"
dependencies = [
    "torch==2.3.1",
    "torchaudio==2.3.1",
    "torchvision==0.18.1",
    "numpy<2",
    "librosa==0.10.2",
    "pandas==2.2.2",
    "tqdm>=4.66,<5",
    "PyYAML",
    "scikit-learn",
    "jupyter",
    "transformers==4.45.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
