# Model settings
model:
  task: "dialect" # Options: gender, dialect
  type: "resnet34"  # Options: densenet121, resnet18, resnet34, mobilenet_v2, CNN
  versions:
    densenet121: "v0.10.0"
    resnet34: "v0.9.0"
    resnet18: "v0.9.0"
    mobilenet_v2: "v0.9.0"
  length: 5  # Match audio.length in config.yaml
  sampling_rate: 22050 # Match audio.sampling_rate in config.yaml
  n_mels: 64 # Match audio.n_mels in config.yaml

  # FFT, window_len, step_size based on sampling rate
  window_configs:
    22050: [1024, 552, 220]
    16000: [512, 400, 160]
    8000: [512, 200, 80]

  # Best validation checkpoint from the latest training run
  checkpoint: "checkpoints/dialect/resnet34_20261010_213509/best_1.pth"

# Dataset paths
datasets:
  paths: ["dataset/noisy_testset.txt", "dataset/clean_testset.txt"] 
  # For inference, paths can be either directories or txt files without header containing path to audio data in each line
